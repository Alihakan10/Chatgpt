name: Kunpeng BIST DEVA Diagnostic

on:
  push:
    paths:
      - ".github/workflows/kun_deva_test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DEVA 60m and 2H candles
        env:
          KUN_TOKEN: ${{ secrets.KUN_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests, json
          token = os.getenv("KUN_TOKEN")
          if not token:
              raise SystemExit("KUN_TOKEN GitHub Secret is missing")

          base = "https://kun.pro/api/history"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
              "User-Agent": "Mozilla/5.0",
          }
          out = {}

          for interval in ("60", "240"):
              params = {
                  "market": "TR",
                  "symbol": "BIST:DEVA",
                  "interval": interval,
                  "count": "100",
                  "token": token,
              }
              r = requests.get(base, params=params, headers=headers, timeout=30)
              print("INTERVAL", interval, "HTTP", r.status_code)
              print("FINAL URL", r.url)
              print(r.text[:12000])

              try:
                  body = r.json()
              except Exception:
                  body = {"raw": r.text}

              out[interval] = {"status": r.status_code, "body": body}

              if r.status_code != 200:
                  raise SystemExit(f"Kunpeng request failed: HTTP {r.status_code}")

          with open("kun_deva_result.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PY

      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kun_deva_result.json
          git commit -m "Diagnostic: save Kunpeng DEVA candles" || exit 0
          git push
