name: 7 BUY Adayi Birebir Dogrulama

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: 7 BUY adayini TradingView ile dogrula
        run: python verify_7_buy.py
