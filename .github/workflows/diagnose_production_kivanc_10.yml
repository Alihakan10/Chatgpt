name: Verify Production Kivanc 10

on:
  push:
    paths:
      - "diagnose_production_kivanc_10.py"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests websocket-client
      - run: python diagnose_production_kivanc_10.py > production_kivanc_10_result.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production_kivanc_10_result.txt
          git diff --cached --quiet || git commit -m "Save production Kivanc 10-stock verification"
          git push
