name: TradingView 14 Stock Feed Check

on:
  push:
    paths:
      - "scanner.py"
      - "diagnose_tv_14.py"
      - ".github/workflows/diagnose_tv_14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
      TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
      TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check 14 stocks
        run: python diagnose_tv_14.py
