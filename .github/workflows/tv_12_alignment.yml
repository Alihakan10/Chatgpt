name: TV 12-stock 2H candle alignment
on:
  push:
    paths:
      - "tests/tv_12_alignment.py"
      - "tests/tv_12_formula_parity.py"
      - ".github/workflows/tv_12_alignment.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests websocket-client
      - name: Fetch native TradingView 2H candles
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
        run: |
          python -u tests/tv_12_alignment.py | tee tv_12_alignment_output.txt
          python -u tests/tv_12_formula_parity.py | tee tv_12_formula_parity_output.txt
      - name: Verify formula diagnostic output
        run: |
          test -s tv_12_formula_parity_output.txt
          wc -c tv_12_formula_parity_output.txt
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: tv-12-formula-parity
          path: |
            tv_12_alignment_output.txt
            tv_12_formula_parity_output.txt
          if-no-files-found: error
