name: Production Scanner Current Code Test

on:
  push:
    paths:
      - ".github/workflows/production_current_test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODE: "false"
      TEST_SYMBOLS: ""
      MANUAL_TEST_RUN: "true"
      FORCE_SCAN: "true"
      SEND_SCAN_REPORT: "true"
      SEND_TEST_TELEGRAM: "false"
      SCAN_LIMIT: "620"
      BUY_STABILIZATION_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run current production scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python verified_scanner.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_state.json
          if git diff --cached --quiet; then
            echo "State degismedi."
          else
            git commit -m "Production current code test state"
            git push
          fi
