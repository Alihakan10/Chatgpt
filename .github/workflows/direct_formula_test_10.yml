name: Direct Production Formula Test 10

on:
  push:
    paths:
      - "scanner.py"
      - "verified_scanner.py"
      - ".github/workflows/direct_formula_test_10.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "false"
      TEST_SYMBOLS: "ACSEL,AKSUE,ATSYH,BESLR,BMSCH,DMRGD,EMNIS,ENPRA,MOBTL,PETUN"
      MANUAL_TEST_RUN: "true"
      FORCE_SCAN: "true"
      SEND_SCAN_REPORT: "false"
      SEND_TEST_TELEGRAM: "false"
      SCAN_LIMIT: "10"
      BUY_STABILIZATION_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python verified_scanner.py
