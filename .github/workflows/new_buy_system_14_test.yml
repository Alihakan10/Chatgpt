name: New BUY System - 14 Stock Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run isolated 14-stock BUY test
        env:
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
        working-directory: new_buy_system
        run: python test_14.py
