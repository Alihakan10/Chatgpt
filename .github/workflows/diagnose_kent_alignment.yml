name: KENT alignment diagnostic
on:
  push:
    paths:
      - "diagnose_kent_alignment.py"
      - "scanner.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run KENT alignment test
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
        run: python diagnose_kent_alignment.py
      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/kent_alignment.json
          git commit -m "Save KENT alignment diagnostic" || true
          git push || true
