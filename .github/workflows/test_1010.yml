name: BIST 10:10 Supertrend Test

on:
  workflow_dispatch:
    inputs:
      test_symbols:
        description: "Virgulle ayrilmis BIST sembolleri"
        required: false
        default: "BIST:ZOREN"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_1010_SYMBOLS: ${{ inputs.test_symbols }}
      TEST_1010_ALL_BIST: "true"
      TEST_1010_WORKERS: "8"

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: 18:00 -> 10:00 Supertrend testi
        run: python test_1010.py
