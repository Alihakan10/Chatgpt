name: TradingView 14 Stock Adjustment Check - FREE DELAYED ANONYMOUS
on:
  push:
    paths:
      - "diagnose_tv_adjustment_14.py"
      - ".github/workflows/diagnose_tv_adjustment_14.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websocket-client
      - name: Compare native 2H adjustment modes
        run: python diagnose_tv_adjustment_14.py
