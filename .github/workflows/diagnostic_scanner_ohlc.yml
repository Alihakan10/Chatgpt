name: Diagnostic Scanner OHLC

on:
  push:
    paths:
      - ".github/workflows/diagnostic_scanner_ohlc.yml"

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Query TradingView Scanner
        env:
          URL: https://scanner.tradingview.com/turkey/scan
        run: |
          python - <<'PY'
          import json, urllib.request
          payload = {
              "columns": ["name","open|120","high|120","low|120","close|120","time|120"],
              "symbols": {"tickers": ["BIST:DEVA"], "query": {"types":[]}},
              "range": [0, 1]
          }
          req = urllib.request.Request(
              "https://scanner.tradingview.com/turkey/scan",
              data=json.dumps(payload).encode(),
              headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              raw = r.read().decode()
          print(raw)
          open("scanner_deva_result.json","w",encoding="utf-8").write(raw)
          PY

      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_deva_result.json
          git commit -m "Diagnostic: TradingView Scanner DEVA 2H OHLC" || exit 0
          git push
