name: Supertrend CC 620 Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: supertrend-cc-620
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketler
        run: pip install -r requirements.txt

      - name: Supertrend CC 620 tarama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_LIMIT: "620"
        run: python supertrend_cc_scanner.py

      - name: CC state kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_cc_state.json
          if git diff --cached --quiet; then
            echo "CC state degismedi."
          else
            git commit -m "Update Supertrend CC BUY state"
            git push
          fi
