name: Supertrend CC 620 Scanner

on:
  push:
    paths:
      - "supertrend_cc_scanner.py"
      - "tests/tv_exact_builtin_diagnostic.py"
      - ".github/workflows/supertrend_cc_scanner.yml"
  workflow_dispatch:
  # GitHub Actions cron is UTC.
  # Turkey is UTC+3, so these run at 12:05, 14:05,
  # 16:05 Istanbul; final scan at 18:15 after the 18:10 closing process.
  schedule:
    - cron: "5 9,11,13 * * 1-5"
    # Final BIST bar is only confirmed after the 18:10 closing process.
    - cron: "15 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: supertrend-cc-620
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketler
        run: pip install -r requirements.txt

      - name: Supertrend CC 620 tarama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_LIMIT: "620"
        run: python supertrend_cc_scanner.py

      - name: Exact TradingView Supertrend diagnostic
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
        run: python -u tests/tv_exact_builtin_diagnostic.py

      - name: 12 hisse parity kontrolu
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
        run: |
          python -u tests/tv_12_formula_parity.py | tee tv_12_final_parity.txt
          test -s tv_12_final_parity.txt

      - name: Upload 12 hisse parity sonucu
        uses: actions/upload-artifact@v4
        with:
          name: tv-12-final-parity
          path: tv_12_final_parity.txt
          if-no-files-found: error

      - name: CC state kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_cc_state.json
          if git diff --cached --quiet; then
            echo "CC state degismedi."
          else
            git commit -m "Update Supertrend CC BUY state"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
