name: Supertrend Formula Verification

on:
  workflow_dispatch:
    inputs:
      verify_symbols:
        description: "Karsilastirilacak BIST sembolleri (virgul ile)"
        required: true
        default: "BIST:ATEKS,BIST:ARFYE,BIST:GESAN,BIST:GLRMK,BIST:SEGMN,BIST:AKFIS"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.31.0' 'websocket-client>=1.8.0'

      - name: Supertrend formul karsilastirmasi
        env:
          VERIFY_SYMBOLS: ${{ inputs.verify_symbols }}
        run: python verify_supertrend.py
