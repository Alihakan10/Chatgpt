name: Diagnose BIST MIXED Feed

on:
  push:
    paths:
      - diagnose_bist_mixed.py
      - .github/workflows/diagnose_bist_mixed.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests websocket-client
      - name: Test feeds
        run: python diagnose_bist_mixed.py
