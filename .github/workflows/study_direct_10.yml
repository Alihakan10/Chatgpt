name: Direct TradingView Study 10 Test

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - "study_direct_10.js"
      - ".github/workflows/study_direct_10.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: node study_direct_10.js > study_direct_10_result.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study_direct_10_result.txt
          git diff --cached --quiet || git commit -m "Save direct TradingView Study 10 test"
          git push
