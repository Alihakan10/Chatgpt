name: 14 Production BUY Live Comparison

on:
  push:
    paths:
      - "diagnose_14_production_live.py"
      - ".github/workflows/diagnose_14_production_live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python diagnose_14_production_live.py
