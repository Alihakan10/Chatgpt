name: KENT Exact Feed Comparison

on:
  push:
    paths:
      - "diagnose_kent_bars.py"
      - ".github/workflows/diagnose_kent_bars.yml"
      - "scanner.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
      TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
      TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python diagnose_kent_bars.py
