name: BIST Early BUY Virtual Test

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes; actual run time can be delayed by GitHub.
    - cron: "*/15 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-early-buy-virtual
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run early BUY virtual scan
        run: python early_buy_bot.py

      - name: Persist virtual signal state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/early_signals.json latest_report.json
          if git diff --cached --quiet; then
            echo "No state/report changes to commit."
          else
            git commit -m "Update early BUY virtual scan state"
            git push
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-buy-report
          path: latest_report.json
          if-no-files-found: ignore
