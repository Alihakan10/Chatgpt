name: TradingView Study 14 Stock Diagnostic

on:
  push:
    paths:
      - "diagnose_tv_study_14.js"
      - ".github/workflows/diagnose_tv_study_14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install @mathieuc/tradingview
      - name: Run Study diagnostic
        run: node diagnose_tv_study_14.js
