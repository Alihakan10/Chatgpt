name: BIST Strategy Research
on:
  workflow_dispatch:
  push:
    paths:
      - "strategy_research.py"
      - ".github/workflows/strategy-research.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: bist-strategy-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compare predefined strategies
        run: python strategy_research.py
      - name: Upload strategy research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bist-strategy-research
          path: strategy_research_report.json
          if-no-files-found: warn
