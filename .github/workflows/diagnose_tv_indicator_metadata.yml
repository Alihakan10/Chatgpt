name: Diagnose TradingView Indicator Metadata

on:
  push:
    paths:
      - "diagnose_tv_indicator_metadata.js"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node diagnose_tv_indicator_metadata.js
