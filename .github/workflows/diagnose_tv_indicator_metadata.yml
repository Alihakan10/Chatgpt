name: Diagnose TradingView Indicator Metadata

on:
  push:
    paths:
      - "diagnose_tv_indicator_metadata.js"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node diagnose_tv_indicator_metadata.js > indicator_metadata.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicator_metadata.txt
          git diff --cached --quiet || git commit -m "Save TradingView indicator metadata diagnostic"
          git push
