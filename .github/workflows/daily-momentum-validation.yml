name: BIST Daily Relative Strength Validation
on:
  workflow_dispatch:
  push:
    paths:
      - "daily_momentum_validation.py"
      - ".github/workflows/daily-momentum-validation.yml"
      - "requirements.txt"
permissions:
  contents: read
concurrency:
  group: bist-daily-momentum-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Restore daily market data cache
        uses: actions/cache@v4
        with:
          path: .market_cache
          key: bist-market-data-${{ github.run_id }}
          restore-keys: |
            bist-market-data-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run daily portfolio validation
        run: python daily_momentum_validation.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bist-daily-momentum-report
          path: daily_momentum_report.json
          if-no-files-found: error
