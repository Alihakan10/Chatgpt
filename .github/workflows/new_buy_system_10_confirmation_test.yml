name: New BUY System - 10 Confirmation Test

on:
  push:
    paths:
      - ".github/workflows/new_buy_system_10_confirmation_test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Test 10 BUY candidates - 4H and 1D only
        env:
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
          TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
        run: python new_buy_system/test_confirmation_10.py
