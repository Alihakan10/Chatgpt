name: Diagnose TradingView Scanner 2H OHLC

on:
  push:
    paths:
      - diagnose_scanner_ohlc.py
      - .github/workflows/diagnose_scanner_ohlc.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run scanner OHLC diagnostic
        run: python diagnose_scanner_ohlc.py
