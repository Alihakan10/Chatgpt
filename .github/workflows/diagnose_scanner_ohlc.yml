name: Diagnose TradingView Scanner 2H OHLC

on:
  push:
    paths:
      - diagnose_scanner_ohlc.py
      - .github/workflows/diagnose_scanner_ohlc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Run scanner OHLC diagnostic
        run: |
          python diagnose_scanner_ohlc.py | tee scanner_ohlc_result.txt

      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scanner_ohlc_result.txt
          git diff --cached --quiet || git commit -m "Record TradingView scanner 2H OHLC result"
          git push
