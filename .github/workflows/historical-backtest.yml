name: BIST Historical Virtual AL-SAT Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "historical_backtest.py"
      - ".github/workflows/historical-backtest.yml"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: bist-historical-virtual-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run historical virtual backtest
        run: python historical_backtest.py
      - name: Upload historical backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-virtual-backtest
          path: historical_backtest_report.json
          if-no-files-found: warn
