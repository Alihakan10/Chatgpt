name: 14 Production BUY Freeze Test

on:
  push:
    paths:
      - ".github/workflows/diagnose_14_freeze_live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run 14-stock freeze test
        env:
          TEST_MODE: "true"
          SEND_TEST_TELEGRAM: "false"
          BUY_STABILIZATION_SECONDS: "30"
          TEST_SYMBOLS: "BIST:ALCAR,BIST:BURCE,BIST:BURVA,BIST:CASA,BIST:CMBTN,BIST:ENERY,BIST:FMIZP,BIST:KNFRT,BIST:KONTR,BIST:ODAS,BIST:POLHO,BIST:QNBFK,BIST:SNPAM,BIST:VKFYO"
        run: python verified_scanner.py
