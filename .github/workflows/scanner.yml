name: BIST Supertrend Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      TEST_SYMBOLS: "BIST:ADGYO,BIST:AKSGY,BIST:ESCOM,BIST:MHRGY,BIST:MNDTR,BIST:OYLUM,BIST:OZSUB,BIST:TUCLK,BIST:TURSG,BIST:USHOL"
      MANUAL_TEST_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      SEND_SCAN_REPORT: "true"
      SEND_TEST_TELEGRAM: "false"
      SCAN_LIMIT: "620"

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node paketleri
        run: npm install

      - name: TradingView gercek BUY testi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tv_exact_buy_scan.js

      - name: State kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_state.json
          if git diff --cached --quiet; then
            echo "State degismedi."
          else
            git commit -m "Update Supertrend BUY state"
            git push
          fi
