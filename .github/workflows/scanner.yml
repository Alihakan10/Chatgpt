name: BIST Supertrend Scanner

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST MODU: 620 HISSENIN 2H SUPERTREND BUY SINYALLERINI TARA"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      test_symbol:
        description: "TEST HISSESI (TEK HISSE TESTINDE KULLANILIR)"
        required: true
        default: "BIST:ATEKS"
      send_test_telegram:
        description: "TEST TELEGRAM MESAJI GONDER"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force_scan:
        description: "MANUEL TARAMA: BIST SAATLERI DISINDA DA TARA"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      send_scan_report:
        description: "TEST RAPORU"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      scan_limit:
        description: "TARAMA HISSE SAYISI"
        required: true
        default: "620"
        type: choice
        options:
          - "200"
          - "620"

  schedule:
    - cron: "10 7-14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python paketleri
        run: python -m pip install --upgrade pip requests websocket-client

      - name: BIST Supertrend taramasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          TEST_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_symbol || 'BIST:ZOREN' }}
          SEND_TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_telegram || 'false' }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan || 'false' }}
          SEND_SCAN_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.send_scan_report || 'true' }}
          SCAN_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_limit || '620' }}
        run: python scanner.py
