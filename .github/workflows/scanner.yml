name: BIST Supertrend Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/scanner.yml"
      - "scanner.py"
      - "verified_scanner.py"
      - "new_buy_system/**"
  schedule:
    - cron: "10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TEST_MODE: "false"
      TEST_SYMBOLS: ""
      MANUAL_TEST_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || 'false' }}
      FORCE_SCAN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || 'false' }}
      SEND_SCAN_REPORT: "true"
      SEND_TEST_TELEGRAM: "false"
      SCAN_LIMIT: "620"
      BUY_STABILIZATION_SECONDS: "30"

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python paketleri
        run: pip install -r requirements.txt

      - name: BIST Supertrend taramasi - ucretsiz gecikmeli TradingView verisi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python verified_scanner.py

      - name: State kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_state.json
          if git diff --cached --quiet; then
            echo "State degismedi."
          else
            git commit -m "Update Supertrend BUY state"
            git push
          fi
