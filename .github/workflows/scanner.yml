name: BIST Supertrend Scanner

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST MODU"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      test_symbol:
        description: "TEST HISSESI"
        required: true
        default: "BIST:ZOREN"
      send_test_telegram:
        description: "TEST TELEGRAM MESAJI GONDER"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "10 7-14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: scanner.py guvenli yamasi
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          path = Path("scanner.py")
          marker = "# SAFE_TELEGRAM_STATE_PATCH_V1"
          text = path.read_text(encoding="utf-8")

          if marker in text:
              print("OK: scanner.py yamasi zaten uygulanmis.")
              raise SystemExit(0)

          new_send = '''# SAFE_TELEGRAM_STATE_PATCH_V1
          TELEGRAM_RETRY_DELAYS = (2, 5, 10)

          def send_telegram(message):
              if not TELEGRAM_BOT_TOKEN:
                  raise RuntimeError("TELEGRAM_BOT_TOKEN eksik")
              if not TELEGRAM_CHAT_ID:
                  raise RuntimeError("TELEGRAM_CHAT_ID eksik")

              url = f"https://api.telegram.org/bot{TELEGRAM_BOT_TOKEN}/sendMessage"
              chunks = [message[i:i + 3900] for i in range(0, len(message), 3900)] or [""]

              for chunk_no, chunk in enumerate(chunks, 1):
                  last_error = None
                  for attempt in range(len(TELEGRAM_RETRY_DELAYS) + 1):
                      try:
                          response = requests.post(
                              url,
                              json={"chat_id": TELEGRAM_CHAT_ID, "text": chunk},
                              timeout=30,
                          )
                          if response.ok:
                              data = response.json()
                              if data.get("ok"):
                                  last_error = None
                                  break
                          status = response.status_code
                          last_error = RuntimeError(
                              f"Telegram HTTP {status}: {response.text[:500]}"
                          )
                          if status not in (429, 500, 502, 503, 504):
                              raise last_error
                      except requests.RequestException as exc:
                          last_error = exc
                      if attempt < len(TELEGRAM_RETRY_DELAYS):
                          delay = TELEGRAM_RETRY_DELAYS[attempt]
                          print(f"Telegram chunk {chunk_no}/{len(chunks)} basarisiz; {delay}s sonra tekrar...")
                          time.sleep(delay)
                  if last_error is not None:
                      raise RuntimeError(f"Telegram gonderilemedi (chunk {chunk_no}/{len(chunks)}): {last_error}")
                  if chunk_no < len(chunks):
                      time.sleep(0.3)

          '''

          pattern = r"(?ms)^def send_telegram\(message\):\n.*?(?=^def |^if __name__ == [\"']__main__[\"']:|\Z)"
          match = re.search(pattern, text)
          if not match:
              print("HATA: send_telegram() bulunamadi; dosya degistirilmedi.")
              raise SystemExit(1)
          text = text[:match.start()] + new_send + text[match.end():]

          old = '''    save_state(state)

          if not new_buy_results:
              return

          message = build_telegram_message(new_buy_results)
          send_telegram(message)
          '''
          new = '''    if not new_buy_results:
        save_state(state)
        return

    message = build_telegram_message(new_buy_results)
    send_telegram(message)
    save_state(state)
          '''
          if old not in text:
              print("HATA: save_state/Telegram siralamasi bulunamadi; dosya degistirilmedi.")
              raise SystemExit(1)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          check = subprocess.run([sys.executable, "-m", "py_compile", "scanner.py"], text=True)
          if check.returncode:
              print("HATA: syntax kontrolu basarisiz; commit yok.")
              raise SystemExit(check.returncode)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "scanner.py"], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"], check=False).returncode != 0:
              subprocess.run(["git", "commit", "-m", "Apply safe Telegram and state fix"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("OK: scanner.py yamasi commit edildi.")
          PY

      - name: BIST Supertrend taramasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          TEST_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_symbol || 'BIST:ZOREN' }}
          SEND_TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_telegram || 'false' }}
        run: python scanner.py
