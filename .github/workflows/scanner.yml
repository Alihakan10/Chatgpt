name: BIST Supertrend Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      TEST_MODE: "false"
      TEST_SYMBOLS: "BIST:ASTOR"
      MANUAL_TEST_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      SEND_SCAN_REPORT: "true"
      SEND_TEST_TELEGRAM: "false"
      SCAN_LIMIT: "620"

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python paketleri
        run: pip install requests websocket-client

      - name: TradingView Supertrend ASTOR testi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scanner.py

