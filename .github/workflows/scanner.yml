name: BIST Supertrend Scanner

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST MODU"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      test_symbol:
        description: "TEST HISSESI"
        required: true
        default: "BIST:ZOREN"
      send_test_telegram:
        description: "TEST TELEGRAM MESAJI GONDER"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_scan:
        description: "MANUEL TARAMA: BIST SAATLERI DISINDA DA TARA"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "10 7-14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: scanner.py guvenli yamasi
        run: python patch_scanner.py

      - name: BIST Supertrend taramasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          TEST_SYMBOLS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_symbol || 'BIST:ZOREN' }}
          SEND_TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_telegram || 'false' }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan || 'false' }}
        run: python scanner.py
