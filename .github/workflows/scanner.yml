name: BIST Supertrend Scanner

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "TEST MODU: 620 HISSENIN 2H SUPERTREND BUY SINYALLERINI TARA"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      test_symbol:
        description: "TEST HISSESI (TEK HISSE TESTINDE KULLANILIR)"
        required: true
        default: "BIST:ATEKS"
      send_test_telegram:
        description: "TEST TELEGRAM MESAJI GONDER"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      force_scan:
        description: "MANUEL TARAMA: BIST SAATLERI DISINDA DA TARA"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      send_scan_report:
        description: "TEST RAPORU"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      scan_limit:
        description: "TARAMA HISSE SAYISI"
        required: true
        default: "620"
        type: choice
        options:
          - "200"
          - "620"

  schedule:
    - cron: "10 7-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bist-supertrend-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node paketleri
        run: npm install

      - name: TradingView gercek BUY taramasi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode || 'false' }}
          TEST_SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.test_symbol || '' }}
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_scan || 'false' }}
          SEND_SCAN_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.send_scan_report || 'true' }}
          SCAN_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_limit || '620' }}
        run: node tv_exact_buy_scan.js

      - name: State kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/supertrend_state.json
          git diff --cached --quiet || git commit -m "Update Supertrend BUY state"
          git push
