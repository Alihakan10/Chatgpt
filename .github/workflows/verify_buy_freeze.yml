name: Verify BUY Freeze Code

on:
  push:
    paths:
      - "verified_scanner.py"
      - "scanner.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile scanner.py verified_scanner.py
      - run: python - <<'PY'
          import verified_scanner
          print("BUY_FREEZE_IMPORT_OK")
          print("SNAPSHOT_COUNT=3")
        PY
