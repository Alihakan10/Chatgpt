name: TradingView SDK 14 Stock Diagnostic

on:
  push:
    paths:
      - "diagnose_tv_sdk_14.py"
      - ".github/workflows/diagnose_tv_sdk_14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install tradingview-api-python
      - name: Run authenticated SDK diagnostic
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
        run: python diagnose_tv_sdk_14.py
      - name: Save diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/tv_sdk_14.json
          if git diff --cached --quiet; then echo "No diagnostic change"; else git commit -m "Add TradingView SDK diagnostic"; git push; fi