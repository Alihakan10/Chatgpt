name: TradingView 14 Stock BIST vs MIXED Check
on:
  push:
    paths:
      - "diagnose_tv_bist_vs_mixed_14.py"
      - ".github/workflows/diagnose_tv_bist_vs_mixed_14.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websocket-client
      - run: python diagnose_tv_bist_vs_mixed_14.py
