name: TradingView Supertrend formula diagnostic
on:
  push:
    paths:
      - "diagnose_tv_supertrend_formula_14.py"
      - ".github/workflows/diagnose_tv_supertrend_formula_14.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websocket-client
      - run: python diagnose_tv_supertrend_formula_14.py
