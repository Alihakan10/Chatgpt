name: Test Automatic BUY Filters - 10 Candidates

on:
  push:
    paths:
      - ".github/workflows/test_auto_filters_10.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_MODE: "true"
      TEST_SYMBOLS: "BIST:ACSEL,BIST:AKSUE,BIST:ATSYH,BIST:BESLR,BIST:BMSCH,BIST:DMRGD,BIST:EMNIS,BIST:ENPRA,BIST:MOBTL,BIST:PETUN"
      SEND_TEST_TELEGRAM: "false"
      SEND_SCAN_REPORT: "false"
      BUY_STABILIZATION_SECONDS: "30"
      TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
      TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
      TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
      TV_DEVICE_T: ${{ secrets.TV_DEVICE_T }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python verified_scanner.py
